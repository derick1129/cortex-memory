[project]
name = "cortex-memory"
version = "0.1.0"
description = "Bi-Temporal 4-Tier Hybrid Cognitive Memory Engine for Coding Agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.3.0,<2.0.0",
    "asyncpg>=0.30.0",
    "neo4j>=5.26.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "fastembed>=0.5.0",
    "openai>=1.60.0",
    "anthropic>=0.42.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

